name: Build and Release Pixel Props

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      devices:
        description: 'Device codenames (space-separated, or "all")'
        required: true
        default: 'all'

jobs:
  # ------------------------------------------------------------------
  # PREPARE: Determine which devices to build based on input or default list
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set_devices.outputs.devices }}
    steps:
      - name: Determine device list
        id: set_devices
        run: |
          # Pixel 6 and newer (Tensor-era devices with modern partition layout)
          if [ "${{ github.event.inputs.devices }}" = "all" ] || [ -z "${{ github.event.inputs.devices }}" ]; then
            JSON='[
              "oriole", "raven", "bluejay",
              "panther", "cheetah", "lynx",
              "felix", "tangorpro",
              "shiba", "husky", "akita",
              "tokay", "caiman", "komodo", "comet", "tegu",
              "frankel", "blazer", "mustang", "stallion", "rango",
              "cubs", "grizzly", "kodiak", "yogi"
            ]'
          else
            # Convert space-separated input into a JSON array
            JSON=$(echo '${{ github.event.inputs.devices }}' | tr ' ' '\n' | jq -R . | jq -s .)
          fi
          {
            echo "devices<<EOF"
            echo "$JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # BUILD: Download OTA, extract props, build module, and check for duplicates
  # ------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full e2fsprogs erofs-utils lz4 cpio \
            dos2unix aria2 curl xxd python3 python3-pip jq

      - name: Install Python dependencies
        run: |
          pip3 install payload_dumper
          which payload_dumper || echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download OTA for ${{ matrix.device }}
        run: bash download_latest_ota_build.sh ${{ matrix.device }}

      - name: Extract and build
        run: bash extract_images.sh

      # Check if this module version was already released to avoid duplicates
      - name: Check for duplicates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(find . -maxdepth 1 -name "*.zip" -type f -print -quit 2>/dev/null)
          if [ -z "$zip" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name=$(basename "$zip")
          echo "Built: $name"

          # Paginate through ALL releases to build a complete asset list
          EXISTING=$(mktemp)
          trap 'rm -f "$EXISTING"' EXIT

          page=1
          while :; do
            assets=$(gh api "repos/${{ github.repository }}/releases?per_page=100&page=${page}" \
              --jq '.[] | .assets[].name' 2>/dev/null)
            [ -z "$assets" ] && break
            printf '%s\n' "$assets" >> "$EXISTING"
            page=$((page + 1))
          done

          # Skip if this exact zip was already released
          if grep -qxF "$name" "$EXISTING" 2>/dev/null; then
            echo "SKIP (already released): $name"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            rm -f "$zip"
            exit 0
          fi

          # Extract metadata from the built module
          codename=$(echo "$name" | cut -d_ -f1 | tr '[:upper:]' '[:lower:]')
          prop=$(find extracted_images -maxdepth 2 -name "module.prop" -path "*/${codename}-ota-*" 2>/dev/null | head -1)
          prop_dir=$(dirname "$prop")
          desc=""
          device_name=""
          build_desc=""
          if [ -f "$prop" ]; then
            desc=$(grep '^description=' "$prop" | cut -d= -f2- | head -1)
            if [ -f "$prop_dir/system.prop" ]; then
              device_name=$(grep -m1 '^ro.product.model=' "$prop_dir/system.prop" 2>/dev/null | cut -d= -f2- | head -1)
              build_desc=$(grep -m1 '^ro.build.description=' "$prop_dir/system.prop" 2>/dev/null | cut -d= -f2- | head -1)
            fi
          fi
          [ -z "$device_name" ] && device_name="${codename^}"

          zip_hash=$(sha256sum "$zip" | awk '{print $1}')

          mkdir -p upload
          mv "$zip" upload/

          # Save structured metadata for the release aggregation step
          jq -n \
            --arg codename "$codename" \
            --arg zip_name "$name" \
            --arg sha256 "$zip_hash" \
            --arg device_name "$device_name" \
            --arg description "$desc" \
            --arg build_desc "$build_desc" \
            '{codename: $codename, zip_name: $zip_name, sha256: $sha256, device_name: $device_name, description: $description, build_desc: $build_desc}' \
            > "upload/metadata-${codename}.json"

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      # Upload module + metadata artifact for the release job to collect
      - name: Upload artifact
        if: steps.check.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.device }}
          path: upload/*
          retention-days: 1

  # ------------------------------------------------------------------
  # RELEASE: Aggregate all built modules, create GitHub release, notify Telegram
  # ------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: module-*
          merge-multiple: true
          path: new_modules/
        continue-on-error: true

      # Collect all modules, generate release notes, publish release, and notify
      - name: Aggregate and publish
        id: aggregate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          COUNT=$(ls new_modules/*.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="build-$(date +%Y%m%d)"
          REPO_URL="https://github.com/${{ github.repository }}"

          # Build per-device release notes in the order defined in prepare
          RELEASE_BODY="Automated build with $COUNT new module(s)."$'\n\n'
          echo '${{ needs.prepare.outputs.devices }}' | jq -r '.[]' | while IFS= read -r device; do
            json="new_modules/metadata-${device}.json"
            [ -f "$json" ] || continue
            
            codename=$(jq -r '.codename' "$json")
            zip_name=$(jq -r '.zip_name' "$json")
            sha256=$(jq -r '.sha256' "$json")
            device_name=$(jq -r '.device_name' "$json")
            build_desc=$(jq -r '.build_desc // empty' "$json")
            
            RELEASE_BODY+="## ${device_name} (${codename^})"$'\n'
            RELEASE_BODY+="- File name: \`${zip_name}\`"$'\n'
            RELEASE_BODY+="- Build Description: \`${build_desc}\`"$'\n'
            RELEASE_BODY+="- File hash (SHA256): \`${sha256}\`"$'\n\n'
          done

          printf '%s' "$RELEASE_BODY" > /tmp/release_notes.md

          # Build Telegram device list in the order defined in prepare
          DEVICE_LIST=""
          echo '${{ needs.prepare.outputs.devices }}' | jq -r '.[]' | while IFS= read -r device; do
            json="new_modules/metadata-${device}.json"
            [ -f "$json" ] || continue
            zip_name=$(jq -r '.zip_name' "$json")
            device_name=$(jq -r '.device_name' "$json")
            download_url="${REPO_URL}/releases/download/${TAG}/${zip_name}"
            DEVICE_LIST+="- **${device_name}**: [${zip_name}](${download_url})"$'\n'
          done

          # Create release if it doesn't exist, otherwise upload to existing
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" new_modules/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release_notes.md \
              new_modules/*.zip
          fi

          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "devices<<EOF"
            printf '%s' "$DEVICE_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: steps.aggregate.outputs.has_new == 'true'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          disable_web_page_preview: true
          format: markdown
          message: |
            **Pixel Props — New OTA Available !**

            **Tag**: [${{ steps.aggregate.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.aggregate.outputs.tag }})
            **Modules**: ${{ steps.aggregate.outputs.count }}

            **Devices**:
            ${{ steps.aggregate.outputs.devices }}
